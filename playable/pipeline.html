<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TDKR playable — pipeline slice (user files only)</title>
<style>
  html,body{margin:0;height:100%;background:#101014;color:#cfd3dc;font:13px/1.4 system-ui}
  #ui{position:fixed;top:8px;left:8px;z-index:9;background:#0008;padding:8px 10px;border-radius:8px;max-width:420px}
  #bar{width:100%;height:6px;background:#222;border-radius:3px;margin:6px 0}
  #barfill{height:6px;width:0;background:#5af;border-radius:3px}
  #err{color:#f87}
  #log{white-space:pre-wrap}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="ui">
  <b>TDKR pipeline slice</b> — all data decoded at runtime from YOUR file.<br>
  Pick the release zip (TDKR_v1.1.6b_APK_OBB.zip).<br>
  <input type="file" id="f">
  <div id="bar"><div id="barfill"></div></div>
  <div id="log">waiting for file…</div><div id="err"></div>
</div>
<script src="./tdkr_pipeline.js"></script>
<script src="./etc1_tdkr.js"></script>
<script type="module">
import * as THREE from 'three';
// s40 T5: JS-heap sampling from module start (Chromium-only API), for the
// end-to-end memory measurement (zip -> actors.gla -> anims -> skin -> READY).
window.__memLog = [];
window.__memDone = false;
if (performance.memory) {
  const mt0 = performance.now();
  const memTimer = setInterval(() => {
    const m = performance.memory;
    window.__memLog.push([Math.round(performance.now() - mt0), m.usedJSHeapSize, m.totalJSHeapSize]);
    if (window.__memDone) clearInterval(memTimer);
  }, 200);
}
const $ = s => document.querySelector(s);
function log(m){ $('#log').textContent += m + '\n'; }
function setbar(p){ $('#barfill').style.width = (p*100).toFixed(0)+'%'; }
function fail(m){ $('#err').textContent = 'ERROR: ' + m; }

$('#f').addEventListener('change', async ev => {
  try {
    const file = ev.target.files[0];
    const t0 = performance.now();
    log(`reading ${file.name} (${(file.size/1e6).toFixed(0)} MB) — LAZY mode`);
    // s38 T5: chunk-lazy — never hold the whole zip; slice + stream-inflate
    // only the three .gla containers, then keep only the needed members.
    const dir = await TDKR.zipDirLazy(file);
    // s39 T7: clear errors for wrong file / wrong game version
    const REQ = ['data/actors.gla', 'data/commons.gla', 'data/game_config.gla', 'textures/actors_tex.gla'];
    const names = [...dir.keys()];   // dir is a Map - Object.keys(map) is always []
    const has = re => names.some(n => re.test(n));
    if (has(/AndroidManifest\.xml$/i) || has(/classes\.dex$/i)) {
      throw new Error('This is the APK (app code), not the game data. ' +
        'Repack the OBB (main.<version>.com.gameloft.android.AMAZ.GloftKRAS.obb) into a zip and select that.');
    }
    if (!has(/com\.gameloft\.android\.AMAZ\.GloftKRAS\//i)) {
      throw new Error('No com.gameloft.android.AMAZ.GloftKRAS entries found (dir=' + dir.size + ' entries, sample=' + [...dir.keys()].slice(0, 2).join('|') + ') - this is not a TDKR data file. ' +
        'Select the zip of the OBB (main.<version>.com.gameloft.android.AMAZ.GloftKRAS.obb), v1.1.6b.');
    }
    const missing = REQ.filter(r => !has(new RegExp(r.replace(/\//g, '\\/') + '$', 'i')));
    if (missing.length) {
      throw new Error('This OBB does not match TDKR v1.1.6b layout - missing: ' + missing.join(', ') +
        '. Only v1.1.6b is supported.');
    }
    // s40 fix: the s39 T7 commit had TWO bugs here - a `names` redeclaration
    // (SyntaxError killing the whole module) and Object.keys() on a Map (always
    // []). Single declaration above now serves both.
    const find = re => names.find(n => re.test(n));
    log(`zip OK: ${dir.size} entries in ${(performance.now()-t0).toFixed(0)} ms`);

    let commons = await TDKR.zipReadLazy(file, find(/data\/commons\.gla$/), dir); setbar(0.25);
    window.__held = { commons_gla: commons.length };
    let actors = await TDKR.zipReadLazy(file, find(/data\/actors\.gla$/), dir); setbar(0.45);
    let actorsTex = await TDKR.zipReadLazy(file, find(/textures\/actors_tex\.gla$/), dir); setbar(0.55);
    const wantActors = new Set(['batman.bdae', 'batman_anims.bdae']);
    const aMem = TDKR.glaSlice(actors, wantActors);
    const gt = TDKR.parseGla(actorsTex);
    const gc = { n: 0 }, ga = { n: 0 };
    log(`actors.gla members kept: ${Object.keys(aMem).join(', ')}; actors_tex chunks: ${gt.n}`);
    const bd = aMem['batman.bdae'];
    const ad = aMem['batman_anims.bdae'];
    const skin = TDKR.readBdae(bd);
    log(`batman.bdae: ${skin.verts.length/3} verts, ${skin.idx.length} idx, ${skin.nodes.length} nodes`);
    const A = TDKR.decodeAnims(ad);
    log(`batman_anims.bdae: ${A.segs.length} segs, ${A.clips.length} clips`);

    // Batman diffuse texture (RGB888, engine header 52 B) — decoded here too
    const texE = gt.ents['chara_Batman_DIFFUSE.tga'];
    let texture = null;
    if (texE) {
      const td = actorsTex.subarray(texE.off, texE.off + texE.size);
      // PVR2 header: u32 height @+4, width @+8 (the old code had them swapped;
      // square textures hid it)
      const th = td[4] | (td[5] << 8) | (td[6] << 16) | (td[7] << 24);
      const tw = td[8] | (td[9] << 8) | (td[10] << 16) | (td[11] << 24);
      const px = td.subarray(52, 52 + tw * th * 3);
      const rgba = new Uint8Array(tw * th * 4);
      // s41 T3 correction: RGB888 memory order is R,G,B (the s40 "BGR fix" was
      // INVERTED; its pool check was circular). Evidence: Batman NM memory means
      // [125.6,127.2,242.9] = z-in-byte2 = standard normal map under RGB;
      // GC_Skybox blue-dominant under RGB; City_BKG corr favors RGB.
      for (let i = 0; i < tw * th; i++) {
        rgba[i*4] = px[i*3]; rgba[i*4+1] = px[i*3+1]; rgba[i*4+2] = px[i*3+2]; rgba[i*4+3] = 255;
      }
      const tex = new THREE.DataTexture(rgba, tw, th, THREE.RGBAFormat);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true; tex.flipY = false;
      texture = tex;
      log(`chara_Batman_DIFFUSE: ${tw}x${th} RGB888 decoded (RGB order, s41 T3 correction)`);
    }

    // ---- s40 T1: STREET TEXTURE decoded in-browser from YOUR files.
    // BakeGroup_Island1_Roads0.tga (2048x2048 ETC1) out of l_gothamcity_tex.gla,
    // inflated + decoded at runtime by etc1_tdkr.js — bit-exact vs the engine's
    // decompressETC1 (647/647 OBB textures SHA256 parity vs the calibrated
    // reference; nulls: col-major blocks 87-97% wrong, shuffled 94-98%,
    // word-swap 99.8%+). Stream-inflates only the archive prefix it needs.
    async function zipReadPrefix(name, need) {
      const e = dir.get(name);
      if (!e) throw new Error('no member: ' + name);
      const lh = new Uint8Array(await file.slice(e.lho, e.lho + 30).arrayBuffer());
      const ldv = new DataView(lh.buffer);
      const nlen = ldv.getUint16(26, true), elen = ldv.getUint16(28, true);
      const dataOff = e.lho + 30 + nlen + elen;
      if (e.method === 0) return new Uint8Array(await file.slice(dataOff, dataOff + Math.min(need, e.csize)).arrayBuffer());
      const ds = new DecompressionStream('deflate-raw');
      const reader = new Response(file.slice(dataOff, dataOff + e.csize).stream().pipeThrough(ds)).body.getReader();
      const out = new Uint8Array(need); let got = 0;
      while (got < need) {
        const { done, value } = await reader.read();
        if (done) break;
        const take = Math.min(value.length, need - got);
        out.set(value.subarray(0, take), got); got += take;
      }
      try { await reader.cancel(); } catch (_) {}
      return out.subarray(0, got);
    }
    try {
      const cityPath = find(/textures\/l_gothamcity_tex\.gla$/i);
      if (cityPath) {
        const head = await zipReadPrefix(cityPath, 262144);
        const nE = (head[12] << 24) | (head[13] << 16) | (head[14] << 8) | head[15];
        const pool = 16 + nE * 16;
        let so = -1, ssz = 0;
        const td2 = new TextDecoder();
        for (let i = 0; i < nE; i++) {
          const o = 16 + i * 16;
          const ro = (head[o] << 24) | (head[o+1] << 16) | (head[o+2] << 8) | head[o+3];
          const rs = (head[o+4] << 24) | (head[o+5] << 16) | (head[o+6] << 8) | head[o+7];
          const rn = (head[o+8] << 24) | (head[o+9] << 16) | (head[o+10] << 8) | head[o+11];
          const nb = pool + rn; let e2 = nb; while (e2 < head.length && head[e2] !== 0) e2++;
          if (td2.decode(head.subarray(nb, e2)) === 'BakeGroup_Island1_Roads0.tga') { so = ro; ssz = rs; break; }
        }
        if (so >= 0) {
          const data = await zipReadPrefix(cityPath, so + ssz);
          window.__cityData = data;
          const td = data.subarray(so, so + ssz);
          const th = td[4] | (td[5] << 8) | (td[6] << 16) | (td[7] << 24);
          const tw = td[8] | (td[9] << 8) | (td[10] << 16) | (td[11] << 24);
          const bppS = td[24] | (td[25] << 8) | (td[26] << 16) | (td[27] << 24);
          const bw = ((tw + 3) >> 2) * ((th + 3) >> 2) * 8;
          if (bppS === 4 && td.length >= 52 + bw) {
            const t1s = performance.now();
            const rgbaS = ETC1_TDKR.decodeRGBA(td.subarray(52, 52 + bw), tw, th);
            log(`street texture BakeGroup_Island1_Roads0: ${tw}x${th} ETC1 decoded in ${(performance.now()-t1s).toFixed(0)} ms`);
            const tex = new THREE.DataTexture(rgbaS, tw, th, THREE.RGBAFormat);
            tex.colorSpace = THREE.SRGBColorSpace; tex.needsUpdate = true; tex.flipY = false;
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            const patch = new THREE.Mesh(new THREE.PlaneGeometry(16, 16),
              new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 }));
            patch.rotation.x = -Math.PI / 2; patch.position.set(0, 0.02, 0);
            scene.add(patch);
            // 2D preview (verifiable without orbiting the 3D view): 512px crop
            const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
            cv.style.cssText = 'position:fixed;right:8px;top:8px;z-index:9;width:256px;height:256px;border:1px solid #556;border-radius:6px';
            const full = document.createElement('canvas'); full.width = tw; full.height = th;
            full.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(rgbaS.buffer, rgbaS.byteOffset, rgbaS.length), tw, th), 0, 0);
            cv.getContext('2d').drawImage(full, 0, 0, 512, 512, 0, 0, 256, 256);
            document.body.appendChild(cv);
            window.__streetRGBA = rgbaS;
            window.__cityData = null;   // release the prefix buffer once decoded
          } else {
            log('street texture: unsupported chunk (bpp ' + bppS + ')');
          }
        } else {
          log('street texture: BakeGroup_Island1_Roads0.tga not found');
        }
      }
    } catch (err) { log('street patch skipped: ' + (err && err.message || err)); }

    // ---- build the GLB in-memory from pipeline output; load via GLTFLoader
    // (this is the engine-verified r36 path: fresh-state three.js vs numpy
    // FK = 0.0000 cm), avoiding hand-rolled bind conventions entirely.
    const byNameC = Object.fromEntries(A.clips.map(c => [c.name, c]));
    function buildGLB() {
      const f32 = a => new Float32Array(a);
      const BIPED = {
        'Bip01_Pelvis':'Bip01','Bip01_Spine':'Bip01_Pelvis','Bip01_Spine1':'Bip01_Spine',
        'Bip01_Neck':'Bip01_Spine1','Bip01_Head':'Bip01_Neck',
        'Bip01_L_Thigh':'Bip01_Pelvis','Bip01_L_Calf':'Bip01_L_Thigh','Bip01_L_Foot':'Bip01_L_Calf',
        'Bip01_R_Thigh':'Bip01_Pelvis','Bip01_R_Calf':'Bip01_R_Thigh','Bip01_R_Foot':'Bip01_R_Calf',
        'Bip01_L_Clavicle':'Bip01_Neck','Bip01_L_UpperArm':'Bip01_L_Clavicle',
        'Bip01_L_Forearm':'Bip01_L_UpperArm','Bip01_L_Hand':'Bip01_L_Forearm',
        'Bip01_R_Clavicle':'Bip01_Neck','Bip01_R_UpperArm':'Bip01_R_Clavicle',
        'Bip01_R_Forearm':'Bip01_R_UpperArm','Bip01_R_Hand':'Bip01_R_Forearm',
        'Bip01_L_Finger0':'Bip01_L_Hand','Bip01_L_Finger01':'Bip01_L_Finger0',
        'Bip01_L_Finger1':'Bip01_L_Hand','Bip01_L_Finger11':'Bip01_L_Finger1',
        'Bip01_L_Finger2':'Bip01_L_Hand','Bip01_L_Finger21':'Bip01_L_Finger2',
        'Bip01_R_Finger0':'Bip01_R_Hand','Bip01_R_Finger01':'Bip01_R_Finger0',
        'Bip01_R_Finger1':'Bip01_R_Hand','Bip01_R_Finger11':'Bip01_R_Finger1',
        'Bip01_R_Finger2':'Bip01_R_Hand','Bip01_R_Finger21':'Bip01_R_Finger2'
      };
      const parentOf = nm => skin.pnameOf[nm] || BIPED[nm] || null;
      const need = []; const inNeed = new Set();
      for (const jn of skin.jointNodes) {
        let nm = jn;
        while (nm && !inNeed.has(nm)) { need.push(nm); inNeed.add(nm); nm = parentOf(nm); }
      }
      const nodeOf = {}; const gnodes = [];
      for (const nm of need) { nodeOf[nm] = gnodes.length; gnodes.push({ name: nm, children: [] }); }
      for (const nm of need) {
        const pr = parentOf(nm);
        if (pr && nodeOf[pr] !== undefined) gnodes[nodeOf[pr]].children.push(nodeOf[nm]);
      }
      for (const nm of need) {
        const nd = skin.nodes.find(x => x.name === nm);
        const n = gnodes[nodeOf[nm]];
        n.translation = nd.t; n.rotation = nd.q; n.scale = nd.s;
      }
      const NVV = skin.verts.length / 3;
      gnodes.push({ name: 'BATMAN_mesh', mesh: 0, skin: 0 });
      const posB = f32(skin.verts), uvB = f32(skin.uvs), wtB = f32(skin.skinW);
      const jnB = u16a(skin.skinJ), idxB = u16a(skin.idx);
      const ibmB = new Float32Array(31 * 16);
      skin.invB.forEach((m, i) => ibmB.set(m, i * 16));
      const order6 = [['pos', posB], ['uv', uvB], ['wt', wtB], ['jn', jnB], ['idx', idxB], ['ibm', ibmB]];
      const offs = {}; let base = 0;
      for (const [k, c] of order6) { while (base % 4) base++; offs[k] = base; base += c.byteLength; }
      const gltf = {
        asset: { version: '2.0', generator: 'tdkr-s37-browser' },
        scene: 0, scenes: [{ nodes: null }],   // roots filled below (r36: rig root + mesh)
        nodes: gnodes,
        skins: [{ inverseBindMatrices: null, joints: skin.jointNodes.map(nm => nodeOf[nm]) }],
        meshes: [{ primitives: [{ attributes: { POSITION: 0, TEXCOORD_0: 1, WEIGHTS_0: 2, JOINTS_0: 3 }, indices: 4, material: 0 }] }],
        materials: [{ pbrMetallicRoughness: { baseColorFactor: [0.8, 0.8, 0.85, 1] } }],
        animations: [], accessors: [], bufferViews: [], buffers: [{ byteLength: 0 }]
      };
      function addAcc(off, ln, count, ctype, typ) {
        gltf.bufferViews.push({ buffer: 0, byteOffset: off, byteLength: ln });
        gltf.accessors.push({ bufferView: gltf.bufferViews.length - 1, componentType: ctype, count, type: typ });
        return gltf.accessors.length - 1;
      }
      addAcc(offs.pos, posB.byteLength, NVV, 5126, 'VEC3');
      addAcc(offs.uv, uvB.byteLength, NVV, 5126, 'VEC2');
      addAcc(offs.wt, wtB.byteLength, NVV, 5126, 'VEC4');
      addAcc(offs.jn, jnB.byteLength, NVV, 5123, 'VEC4');
      addAcc(offs.idx, idxB.byteLength, idxB.length, 5123, 'SCALAR');
      gltf.skins[0].inverseBindMatrices = addAcc(offs.ibm, ibmB.byteLength, 31, 5126, 'MAT4');
      const animBins = []; let ab = 0;
      for (const nm of ['_001_idle_stand', '_007_walk', '_008_run']) {
        const clip = byNameC[nm]; if (!clip) continue;
        const { chans } = TDKR.assembleClip(A, clip);
        const samplers = []; const chansG = [];
        for (let c = 0; c < 78; c++) {
          const ch = chans[c]; if (!ch) continue;
          const meta = A.CH[c];
          let nmb = meta.name || '';
          nmb = nmb.endsWith('-node') ? nmb.slice(0, -5) : nmb;
          if (nodeOf[nmb] === undefined) continue;
          const ncomp = meta.ty === 1 ? 3 : 4;
          // dedupe by tick (keep first) — r26 documented the duplicated keys at
          // chunk boundaries (overlap [30000,31950]); zero-width interpolation
          // intervals produce NaN in three.js Interpolant.
          const seen = new Set();
          const tks = [], vks = [];
          for (let i = 0; i < ch.t.length; i++) {
            const t = ch.t[i];
            if (seen.has(t)) continue;
            seen.add(t); tks.push(t); vks.push(ch.v[i]);
          }
          const tb = new Float32Array(tks.length);
          const tb0 = tks[0];
          for (let i = 0; i < tks.length; i++) tb[i] = (tks[i] - tb0) / 1000;
          const ob = new Float32Array(tks.length * ncomp);
          vks.forEach((row, i) => { for (let d = 0; d < ncomp; d++) ob[i * ncomp + d] = row[d]; });
          while (ab % 4) { animBins.push(new Uint8Array(1)); ab++; }
          const tOff = ab; animBins.push(tb); ab += tb.byteLength;
          while (ab % 4) { animBins.push(new Uint8Array(1)); ab++; }
          const oOff = ab; animBins.push(ob); ab += ob.byteLength;
          while (ab % 4) { animBins.push(new Uint8Array(1)); ab++; }
          gltf.bufferViews.push({ buffer: 0, byteOffset: base + tOff, byteLength: tb.byteLength });
          gltf.accessors.push({ bufferView: gltf.bufferViews.length - 1, componentType: 5126, count: tks.length, type: 'SCALAR' });
          const ti = gltf.accessors.length - 1;
          gltf.bufferViews.push({ buffer: 0, byteOffset: base + oOff, byteLength: ob.byteLength });
          gltf.accessors.push({ bufferView: gltf.bufferViews.length - 1, componentType: 5126, count: tks.length, type: ncomp === 4 ? 'VEC4' : 'VEC3' });
          const oi = gltf.accessors.length - 1;
          samplers.push({ input: ti, output: oi, interpolation: 'LINEAR' });
          chansG.push({ sampler: samplers.length - 1, target: { node: nodeOf[nmb], path: meta.ty === 1 ? 'translation' : 'rotation' } });
        }
        gltf.animations.push({ name: nm, samplers, channels: chansG });
      }
      // scene roots: every node whose parent is outside the rig set, + the mesh node
      const roots = [];
      for (let i = 0; i < gnodes.length - 1; i++) {
        const pr = parentOf(gnodes[i].name);
        if (!pr || nodeOf[pr] === undefined || nodeOf[pr] === i) roots.push(i);
      }
      roots.push(gnodes.length - 1);
      gltf.scenes[0].nodes = roots;
      gltf.buffers[0].byteLength = base + ab;
      const bin = new Uint8Array(base + ab);
      for (const [k, c] of order6) bin.set(new Uint8Array(c.buffer, c.byteOffset, c.byteLength), offs[k]);
      let o4 = base;
      for (const blk of animBins) {
        if (blk instanceof Float32Array) { while (o4 % 4) o4++; }
        bin.set(new Uint8Array(blk.buffer, blk.byteOffset, blk.byteLength), o4);
        o4 += blk.byteLength;
      }
      let js = new TextEncoder().encode(JSON.stringify(gltf));
      while (js.length % 4) js = new Uint8Array([...js, 32]);
      const total = 12 + 8 + js.length + 8 + bin.length;
      const out = new Uint8Array(total); const dv = new DataView(out.buffer);
      dv.setUint32(0, 0x46546C67, true); dv.setUint32(4, 2, true); dv.setUint32(8, total, true);
      dv.setUint32(12, js.length, true); dv.setUint32(16, 0x4E4F534A, true); out.set(js, 20);
      dv.setUint32(20 + js.length, bin.length, true); dv.setUint32(24 + js.length, 0x004E4942, true);
      out.set(bin, 28 + js.length);
      return out;
    }
    function u16a(arr) { const o = new Uint16Array(arr.length); o.set(arr); return o; }
    const glbBytes = buildGLB();
    window.__glb = glbBytes;
    log('GLB assembled in-memory: ' + (glbBytes.length / 1024).toFixed(0) + ' KB');
    const { GLTFLoader } = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js');
    const gltf = await new Promise((res, rej) => new GLTFLoader().parse(glbBytes.buffer, '', res, rej));
    let sm = null; gltf.scene.traverse(o => { if (o.isSkinnedMesh) sm = o; });
    sm.frustumCulled = false;
    sm.material.side = THREE.DoubleSide;
    // texture deferred (UV orientation + colorspace still under test this slice)
    if (texture) { sm.material.map = texture; sm.material.color.set(0xffffff); sm.material.needsUpdate = true; }
    scene.add(gltf.scene);
    const gltfScene = gltf.scene;
    gltfScene.rotation.x = -Math.PI / 2;   // raw rig is z-up (r24/r37) -> y-up
    window.__mesh = sm; window.__THREE = THREE;
    log('skinned mesh loaded via GLTFLoader (engine-verified path)');
    // animations come from the in-memory GLB (engine-verified assembly)
    const mixer = new THREE.AnimationMixer(sm);
    window.__mixer = mixer;
    // s40 T5: the big container ArrayBuffers are no longer needed — every
    // consumer (skin, anims, texture) already decoded/copied. Release them so
    // steady-state RSS reflects the live scene, not dead containers.
    window.__held.actors_gla = actors.length;
    window.__held.actors_tex = actorsTex.length;
    commons = null; actors = null; actorsTex = null;
    if (window.__cityData) { window.__held.street_prefix = window.__cityData.length; window.__cityData = null; }
    const acts = {};
    for (const clip of gltf.animations) {
      acts[clip.name] = mixer.clipAction(clip);
      log(`clip ${clip.name}: ${clip.tracks.length} tracks, ${clip.duration.toFixed(2)}s`);
    }
    acts['_001_idle_stand'].play();
    setbar(1);
    log(`READY in ${(performance.now()-t0).toFixed(0)} ms — WASD move, Shift run`);

    // controls: capsule walk on flat ground
    const keys = {};
    addEventListener('keydown', e => keys[e.code] = true);
    addEventListener('keyup', e => keys[e.code] = false);
    let pos = new THREE.Vector3(0, 0, 0), yaw = 0, cur = '_001_idle_stand';
    const clock = new THREE.Clock();
    function frame() {
      try { return frameInner(); }
      catch (e) { fail(String(e && e.stack || e).slice(0, 600)); throw e; }
    }
    function frameInner() {
      const dt = Math.min(clock.getDelta(), 0.05);
      let fwd = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
      let turn = (keys.KeyA ? 1 : 0) - (keys.KeyD ? 1 : 0);
      const run = keys.ShiftLeft || keys.ShiftRight;
      const speed = run ? 5.2 : 1.6;
      if (fwd || turn) yaw += turn * 2.2 * dt;
      const moving = fwd > 0;
      const want = moving ? (run ? '_008_run' : '_007_walk') : '_001_idle_stand';
      if (want !== cur && acts[want]) {
        const from = acts[cur], to = acts[want];
        to.reset().play(); to.crossFadeFrom(from, 0.25, true);
        cur = want;
      }
      if (moving) {
        pos.x += Math.sin(yaw) * speed * dt;
        pos.z += Math.cos(yaw) * speed * dt;
      }
      gltfScene.position.set(pos.x, 0, pos.z);
    // NOTE: raw rig z-up rotated by the armature; model forward = raw +y -> world -z
      gltfScene.rotation.y = yaw;
      mixer.update(dt);
      camera.position.set(pos.x - Math.sin(yaw) * 3.4, 1.9, pos.z - Math.cos(yaw) * 3.4);
      camera.lookAt(pos.x, 1.0, pos.z);
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  } catch (e) {
    fail(String(e && e.stack || e).slice(0, 500));
    console.error(e);
  }
});
