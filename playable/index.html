<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TDKR first playable — walk as Batman (r25 T6)</title>
<style>
 html,body{margin:0;height:100%;background:#0a0d12;color:#cfd6e0;font:12px/1.4 monospace;overflow:hidden}
 #log{position:fixed;left:10px;top:10px;width:430px;max-height:72vh;overflow:auto;background:#11151ccc;
      border:1px solid #232a35;padding:8px;border-radius:6px;white-space:pre-wrap;z-index:5}
 #hud{position:fixed;right:10px;top:10px;text-align:right;z-index:5;color:#7d8794}
</style></head><body>
<div id="log">T6 first playable — WASD/arrows to walk, Shift = run.<br>Triggers fire Lua via fengari.<br>?userfiles=1: ground = navmesh + walls = collision soup, both parsed from YOUR zip (s45 T2 walker adoption).</div>
<div id="hud">FPS: <span id="fps">-</span><br>pos <span id="pos">-</span><br>
speed <span id="spd">0</span> m/s<br>triggers hit <span id="hits">0</span></div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script src="./fengari-web.js"></script>
<script src="./tdkr_pipeline.js"></script>
<script src="./lvc.js"></script>
<script src="./walktest.js"></script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const LOG = document.getElementById('log');
function log(s){ const d=document.createElement('div'); d.textContent=s; LOG.appendChild(d); LOG.scrollTop=LOG.scrollHeight; }

const patch = await (await fetch('./patch.json')).json();
const GATE = location.hash.includes('gate');   // test-only: silhouette gate view
log('collision patch: ' + patch.tris.n + ' tris; triggers: ' + patch.triggers.length +
    ' (' + patch.triggers.filter(t=>t.has_script).length + ' with scripts)');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;   // sRGB output (r160 default, explicit per gate)
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(GATE ? 0xffffff : 0x0a0d12);
if (!GATE) scene.fog = new THREE.Fog(0x0a0d12, 60, 220);
if (GATE) { document.getElementById('log').style.display = 'none'; document.getElementById('hud').style.display = 'none'; }
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 800);
// r160 physical light units: legacy intensities render ~3x dark (s38 albedo gate)
scene.add(new THREE.HemisphereLight(0x8899bb, 0x223322, 2.6));
scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const sun = new THREE.DirectionalLight(0xffeecc, 3.0); sun.position.set(60, 120, 40); scene.add(sun);

// collision patch
if (!GATE) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(patch.tris.flat, 3));
  g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: 0x35404d, side: THREE.DoubleSide })));
}
// trigger markers
if (!GATE) for (const t of patch.triggers) {
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.05, 16),
    new THREE.MeshBasicMaterial({ color: t.has_script ? 0xe8b34b : 0x445566, transparent: true, opacity: 0.6 }));
  ring.position.set(t.pos[0], t.pos[2] + 0.03, -t.pos[1]);
  scene.add(ring);
}

// collision lookup (game coords x east / y north / z up)
const G = 8.0, flat = patch.tris.flat, NT = patch.tris.n;
const grid = new Map();
for (let i = 0; i < NT; i++) {
  const ax=flat[i*9], ay=flat[i*9+1], bx=flat[i*9+3], by=flat[i*9+4], cx=flat[i*9+6], cy=flat[i*9+7];
  const area2 = (bx-ax)*(cy-ay)-(by-ay)*(cx-ax);
  if (Math.abs(area2) < 1e-6) continue;
  for (let gx=Math.floor(Math.min(ax,bx,cx)/G); gx<=Math.floor(Math.max(ax,bx,cx)/G); gx++)
    for (let gy=Math.floor(Math.min(ay,by,cy)/G); gy<=Math.floor(Math.max(ay,by,cy)/G); gy++) {
      const k = gx+':'+gy;
      if (!grid.has(k)) grid.set(k, []);
      grid.get(k).push(i);
    }
}
function groundAt(x, y, zref, up=1.2) {
  const gx=Math.floor(x/G), gy=Math.floor(y/G);
  let best=-1e9;
  for (let dx=-1;dx<=1;dx++) for (let dy=-1;dy<=1;dy++) {
    const cell=grid.get((gx+dx)+':'+(gy+dy)); if(!cell) continue;
    for (const i of cell) {
      const ax=flat[i*9],ay=flat[i*9+1],az=flat[i*9+2];
      const bx=flat[i*9+3],by=flat[i*9+4],bz=flat[i*9+5];
      const cx=flat[i*9+6],cy=flat[i*9+7],cz=flat[i*9+8];
      const det=(by-cy)*(ax-cx)+(cx-bx)*(ay-cy);
      if(Math.abs(det)<1e-9) continue;
      const l1=((by-cy)*(x-cx)+(cx-bx)*(y-cy))/det;
      const l2=((cy-ay)*(x-cx)+(ax-cx)*(y-cy))/det;
      const l3=1-l1-l2;
      if(l1>=-0.02&&l2>=-0.02&&l3>=-0.02){
        const z=l1*az+l2*bz+l3*cz;
        if(z<=zref+up&&z>best)best=z;
      }
    }
  }
  return best;
}

// fengari Lua with logging stubs (stubs push on Ls — r25 T5 fix)
const lua = fengari.lua, lauxlib = fengari.lauxlib, lualib = fengari.lualib;
const to_luastring = fengari.to_luastring, to_jsstring = fengari.to_jsstring;
function mkLua(luaLog) {
  const L = lauxlib.luaL_newstate();
  lualib.luaL_openlibs(L);
  const stub = (name, fn) => {
    lua.lua_pushcfunction(L, function(Ls) {
      const n = lua.lua_gettop(Ls); const args = [];
      for (let i = 1; i <= n; i++) {
        const t = lua.lua_type(Ls, i);
        if (t === lua.LUA_TNUMBER) args.push(+lua.lua_tonumber(Ls, i).toFixed(2));
        else if (t === lua.LUA_TSTRING) args.push(to_jsstring(lua.lua_tolstring(Ls, i)));
        else if (t === lua.LUA_TBOOLEAN) args.push(!!lua.lua_toboolean(Ls, i));
      }
      luaLog.push(name + '(' + args.join(', ') + ')');
      if (fn) return fn(Ls, args);
      return 0;
    });
    lua.lua_setglobal(L, to_luastring(name));
  };
  stub('Wait', (Ls) => lua.lua_yield(Ls, 0));
  for (const nm of ['StartFadeOut','StartFadeIn','RequireLoadLevel','Enable','Disable',
    'ShowObject','HideObject','ShowMessage','ObjectiveAdd','ObjectiveRemove',
    'ShowObjectiveMessage','ClearObjectiveMessage','StartSound','ActorSetState',
    'ActorLookTo','SetActorSpeedWalk','KillActor','GiveDamage','StartMainStoryFromQuestId',
    'NextMission','SetQuestEnabled','SaveGame','MissionFailed']) stub(nm);
  stub('GetTime', (Ls) => { lua.lua_pushnumber(Ls, performance.now()); return 1; });
  stub('ActorIsInStateType', (Ls) => { lua.lua_pushboolean(Ls, true); return 1; });
  stub('IsDead', (Ls) => { lua.lua_pushboolean(Ls, false); return 1; });
  stub('GetDistFromMC', (Ls) => { lua.lua_pushnumber(Ls, 12.5); return 1; });
  stub('Random', (Ls) => { lua.lua_pushnumber(Ls, 1); return 1; });
  stub('IsEnabled', (Ls) => { lua.lua_pushboolean(Ls, true); return 1; });
  stub('IsCopAIEnabled', (Ls) => { lua.lua_pushboolean(Ls, false); return 1; });
  stub('IsLowEndDevice', (Ls) => { lua.lua_pushboolean(Ls, false); return 1; });
  stub('GetGlobalVar', (Ls) => { lua.lua_pushnumber(Ls, 0); return 1; });
  stub('print', (Ls, n) => 0);
  return L;
}

// batman
let mixer = null; const actions = {}; let batman = null;
new GLTFLoader().load('./batman.glb', (g) => {
  batman = g.scene; scene.add(batman);
  // RAW RIG IS Z-UP: rotate a bone ANCESTOR (never the mesh node — skinned verts
  // ignore the mesh node transform; bones must carry the rotation). s38 T1a proof:
  // GPU net skinning = SUM w_b (bone.matrixWorld @ ibm_b) v in world space.
  batman.rotation.x = -Math.PI / 2;
  mixer = new THREE.AnimationMixer(batman);
  for (const c of g.animations) actions[c.name] = mixer.clipAction(c);
  // s39 T5: state->clip RESOLUTION FROM THE gol.bin TABLE (s38 T4 extraction,
  // 542 bindings; validation: idle/air classes significant at p<0.001). The
  // playable GLB ships 5 clips, so bindings not shipped fall back to the
  // nearest embedded clip via the table below (state -> [bound, fallback]).
  window.__STATE_TABLE = {
    'Idle':        ['_001_idle_stand'],
    'Idle_to_Walk': ['_559_bat_idle_to_walk', '_007_walk'],
    'Walk':        ['_007_walk'],
    'Walk_to_Run':  ['_564_bat_walk_to_run', '_008_run'],
    'Run':        ['_008_run'],
    'Run_to_Idle':  ['_562_bat_run_to_idle', '_001_idle_stand']
  };
  const idle = actions['_001_idle_stand'], run = actions['_008_run'];
  if (idle) { idle.play(); }
  if (run) { run.play(); }
  if (idle && run) { idle.setEffectiveWeight(1); run.setEffectiveWeight(0); }
  log('batman.glb: ' + g.animations.map(a => a.name + ' ' + a.duration.toFixed(2) + 's').join(', '));
  // deterministic pose hook for the release gate (screenshot IoU):
  if (location.hash.startsWith('#freeze')) {
    const t = parseFloat(location.hash.slice(8)) || 0.5;
    const idle = actions['_001_idle_stand'];
    if (idle) { idle.play(); mixer.setTime(t); }
    window.__frozen = { mixer, actions, batman, poseT: t };
    log('FROZEN pose idle@' + t + 's for gate');
  }
}, undefined, (e) => log('GLB ERROR: ' + e));

// s45 T2 walker adoption (?userfiles=1): ground = navmesh surface, walls =
// user-zip collision soup (step-ignore 0.55) — the capsule is driven by the
// same code the walktest harness verifies (24/24 route agreement).
const WALKER = { active: false, chk: null, soupN: 0 };
window.__WALKER = WALKER;
if (new URLSearchParams(location.search).get('userfiles') === '1') {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.id = 'zipfile'; inp.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:9';
  document.body.appendChild(inp);
  log('pick the release zip (TDKR_v1.1.6b_APK_OBB.zip) to activate navmesh+soup grounding');
  inp.addEventListener('change', async ev => {
    try {
      const file = ev.target.files[0];
      const dir = await TDKR.zipDirLazy(file);
      const names = [...dir.keys()];
      const gcPath = names.find(n => /data\/game_config\.gla$/i.test(n));
      if (!gcPath) throw new Error('game_config.gla not found in the zip');
      const gc = await TDKR.zipReadLazy(file, gcPath, dir);
      const nmBytes = TDKR.glaSlice(gc, new Set(['GothamCity_502299_navdata.nm']))['GothamCity_502299_navdata.nm'];
      if (!nmBytes) throw new Error('navdata member not found');
      const cmode = new URLSearchParams(location.search).get('corrupt');
      if (cmode === '1') { nmBytes[3] ^= 0xff; log('NEGATIVE CONTROL: navmesh byte corrupted (?corrupt=1)'); }
      if (cmode === '2') { log('NEGATIVE CONTROL: lvc bytes corrupted (?corrupt=2)'); }
      WALKER.chk = loadNavmesh(nmBytes);
      if (!WALKER.chk.ok) throw new Error('navmesh self-check FAILED');
      const lvcBytes = TDKR.glaSlice(gc, new Set(['GothamCity.lvc']))['GothamCity.lvc'];
      if (cmode === '2') { for (let zb = 4000000; zb < 4000064; zb++) lvcBytes[zb] ^= 0xff; }
      const table = await (await fetch('./lvc_readseq_s30.json')).json();
      const gol = await (await fetch('./lvc_gol_templates.json')).json();
      const built = buildSoupFromLvc(lvcBytes, table, gol);
      const soupSha = [...new Uint8Array(await crypto.subtle.digest('SHA-256', built.buf))].map(x => x.toString(16).padStart(2, '0')).join('');
      const SOUP_SHA = '00ce7970e45adc854ac7cae6d0f97797b602342d101e1ecb5eb1c2c01016beb8';
      if (soupSha !== SOUP_SHA) throw new Error('soup digest MISMATCH: ' + soupSha.slice(0, 16) + ' (expected ' + SOUP_SHA.slice(0, 16) + ')');
      loadSoup(built.buf);
      WALKER.soupN = built.nTri;
      WALKER.active = true;
      inp.remove();
      log('WALKER ACTIVE: navmesh ' + WALKER.chk.vcount + 'v/' + WALKER.chk.ccount +
          'c, soup ' + built.nTri + ' tris (sha-verified) — capsule now walks the navmesh');
    } catch (e) { log('WALKER ERROR: ' + (e && e.message || e)); console.error(e); }
  });
}
// player (game coords)
const spawn = patch.spawns[0] ? patch.spawns[0].pos : [-140.7, -681.2, 0.1];
const P = { x: spawn[0], y: spawn[1], z: spawn[2] + 0.9, speed: 0 };
const keys = {};
addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// triggers — r26 T2: DATA-DETERMINED volumes from the engine (CTriggerShapeAABB):
// half-extents = 0.5 * BuiltinBox.size * ownerScale (BuiltinBox::Load = 3 f32
// sizes in the level data; 64-B OBB template = identity 4x4 from init@0x74eb30).
// patch.json triggers carry t.half = [hx, hy, hz] (0.5*scale; size p50 = 1 m).
const fired = new Set(); let hitCount = 0;
function checkTriggers() {
  for (const t of patch.triggers) {
    if (!t.has_script || fired.has(t.id)) continue;
    const h = t.half || [0.75, 0.75, 0.75];   // fallback = r25 assumed B=1.5
    const dh = Math.hypot(P.x - t.pos[0], P.y - t.pos[1]);
    const dz = Math.abs(P.z - 0.9 - t.pos[2]);
    if (dh < Math.hypot(h[0], h[1]) * 0.85 && dz < h[2] + 1.0) {
      fired.add(t.id); hitCount++;
      document.getElementById('hits').textContent = hitCount;
      log('ENTER trigger ' + t.id + ' (' + t.fn + ') dist ' + dh.toFixed(2) + ' m');
      const luaLog = [];
      const L = mkLua(luaLog);
      const co = lua.lua_newthread(L);
      if (lauxlib.luaL_dostring(co, to_luastring(t.script)) === lua.LUA_OK) {
        lua.lua_getglobal(co, to_luastring(t.fn));
        if (lua.lua_isfunction(co, -1)) {
          lua.lua_pushlightuserdata(co, null);
          let res = lua.lua_resume(co, L, 1), n = 0;
          while (res === lua.LUA_YIELD && n < 32) { n++; res = lua.lua_resume(co, L, 0); }
        } else log('  (handler not found: ' + t.fn + ')');
        for (const line of luaLog) log('  lua: ' + line);
      } else {
        const e = lua.lua_tostring(co, -1);
        log('  lua load error: ' + (e ? to_jsstring(e) : '?'));
      }
    }
  }
}

let last = performance.now(), fpsAcc = 0, fpsN = 0;
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  fpsAcc += 1/dt; fpsN++;
  if (fpsN >= 30) { document.getElementById('fps').textContent = (fpsAcc/fpsN).toFixed(0); fpsAcc=0; fpsN=0; }

  let vx = 0, vy = 0;
  if (keys['w'] || keys['arrowup']) vy += 1;
  if (keys['s'] || keys['arrowdown']) vy -= 1;
  if (keys['a'] || keys['arrowleft']) vx -= 1;
  if (keys['d'] || keys['arrowright']) vx += 1;
  const running = !!(keys['shift']);
  const target = (vx || vy) ? (running ? 5.2 : 1.6) : 0;
  P.speed += (target - P.speed) * Math.min(1, dt * 8);

  if (vx || vy) {
    const L2 = Math.hypot(vx, vy); vx /= L2; vy /= L2;
    const sp = P.speed * dt;
    const nx = P.x + vx * sp, ny = P.y + vy * sp;
    if (WALKER.active) {
      const sp2 = [nx, ny, P.z];
      const gz2 = nm_ground(nx, ny, P.z + 2.6);
      if (gz2 > -1e8 && !blocked(sp2) && gz2 - (P.z - 0.9) < 0.85) { P.x = nx; P.y = ny; P.z = gz2 + 0.9; }
    } else {
      const gz = groundAt(nx, ny, P.z, 0.85);
      if (gz > -1e8 && gz - (P.z - 0.9) < 0.85) { P.x = nx; P.y = ny; P.z = gz + 0.9; }
    }
  }
  window.__P = P;
  checkTriggers();

  if (batman) {
    batman.position.set(P.x, P.z - 0.9, -P.y);
    if (!window.__frozen) {
      if (vx || vy) batman.rotation.y = Math.atan2(-vx, -vy) + Math.PI;
      if (mixer) {
        // state resolved by name through the table, then played from it
        const st = P.speed < 0.2 ? 'Idle' : (P.speed < 2.6 ? 'Walk' : 'Run');
        if (st !== window.__state) {
          window.__state = st;
          const names = (window.__STATE_TABLE && window.__STATE_TABLE[st]) || [];
          for (const k of Object.keys(actions)) actions[k].setEffectiveWeight(0);
          for (const nm of names) {
            if (actions[nm]) { actions[nm].play(); actions[nm].setEffectiveWeight(1); break; }
          }
        }
        mixer.update(dt);
      }
    }
  }
  if (GATE) {
    camera.position.set(P.x, P.z + 0.2, -P.y + 4.2);
    camera.lookAt(P.x, P.z + 0.1, -P.y);
  } else {
    camera.position.set(P.x, P.z + 3.2, -P.y + 6.5);
    camera.lookAt(P.x, P.z - 0.4, -P.y);
  }
  document.getElementById('pos').textContent = P.x.toFixed(1) + ', ' + P.y.toFixed(1) + ', ' + P.z.toFixed(1);
  document.getElementById('spd').textContent = P.speed.toFixed(1);
  renderer.render(scene, camera);
}
requestAnimationFrame(tick);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script></body></html>
